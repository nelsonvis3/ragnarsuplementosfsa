databases:
  - name: ragnar-db
    databaseName: ragnar
    user: ragnar
    plan: 0.1c-256mb
    region: ohio

services:
  - type: web
    name: ragnar-api
    runtime: python
    plan: 0.5c-512mb
    region: ohio
    buildCommand: pip install -r requirements.txt && python backend/manage.py collectstatic --noinput
    preDeployCommand: python backend/manage.py migrate --noinput && python backend/manage.py ensure_catalogo
    startCommand: gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: ragnar-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: DATABASE_URL
        fromDatabase:
          name: ragnar-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://ragnar-web.onrender.com
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        value: ^https://ragnar-web(?:-[a-z0-9-]+)?\.onrender\.com$
      - key: PEDIDO_RESERVA_MINUTOS
        value: "1440"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "0"
      - key: PAGO_ALIAS
        sync: false
      - key: PAGO_CVU
        sync: false
      - key: PAGO_TITULAR
        sync: false

  - type: web
    name: ragnar-web
    runtime: node
    plan: 0.5c-512mb
    region: ohio
    buildCommand: npm ci && node scripts/render-build.mjs
    startCommand: npm start -- --hostname 0.0.0.0
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: DJANGO_API_HOST
        fromService:
          type: web
          name: ragnar-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME

  - type: cron
    name: ragnar-expirar-reservas
    runtime: python
    plan: 0.5c-512mb
    region: ohio
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/manage.py expirar_reservas
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: ragnar-api
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: ragnar-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: DATABASE_URL
        fromDatabase:
          name: ragnar-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://ragnar-web.onrender.com
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        value: ^https://ragnar-web(?:-[a-z0-9-]+)?\.onrender\.com$
